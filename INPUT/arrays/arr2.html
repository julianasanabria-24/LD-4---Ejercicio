<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>arr2</title>
</head>

<body>
  <input type="text" id="textInput">
  <button id="btn">Enviar</button>
  <button id="btn2">Eliminar</button>
  <button id="btn3" >Eliminar Primero</button>
  <button id="btn4">Mostrar Lista</button>
  <button id="btn5">Buscar</button>

  <p id="resultado"></p>
  <ul id="lista"></ul>

  <script>
    //arreglo añadido//
    let arr=["manzana","pera","uva","mango","piña","fresa","melon","kiwi","naranja","limon","papaya","banano"];

    const textInput = document.getElementById('textInput');
    const btn = document.getElementById('btn');
    const resultado = document.getElementById("resultado");
    const btn2 = document.getElementById('btn2');
    const btn3 = document.getElementById('btn3');
    const btn4 = document.getElementById('btn4');
    const lista = document.getElementById('lista');
    const btn5 = document.getElementById('btn5');
    
    btn.addEventListener("click", function(){
      console.log("input:", textInput.value.trim().toLowerCase());
      resultado.textContent = "Valor ingresado: " + textInput.value.trim().toLowerCase();
 
      //agrgar el valor ingresado al arreglo//
      arr.push(textInput.value.trim().toLowerCase());

      //agrgar el valor ingresado al inicio de ese arreglo"//
      arr.unshift(textInput.value.trim().toLowerCase());
    });

    
function eliminarUltimo(){
if (arr.length > 0) {
    let eliminado = arr.pop();
    resultado.textContent = "Ultimo elemento eliminado: " + eliminado;

} else {
  resultado.textContent = "El arreglo esta vacio.";
}
}

    btn2.addEventListener("click", eliminarUltimo);


function eliminarPrimero(){
if (arr.length > 0) {
    let eliminado = arr.shift();
    resultado.textContent = "Primer elemento eliminado: " + eliminado;
    mostrarLista();
} else {
    resultado.textContent = "El arreglo esta vacio.";
}
}

    btn3.addEventListener("click", eliminarPrimero);


function mostrarLista(){
  lista.innerHTML = "";
  arr.forEach(function(item){
    let li = document.createElement("li");
    li.textContent = item;
    lista.appendChild(li);
  });
}

    btn4.addEventListener("click", mostrarLista);


    function buscarElemento() {
      let valorBuscado = textInput.value.trim().toLowerCase();
      let indice = arr.indexOf(valorBuscado);

      if (indice !== -1) {
        resultado.textContent = "Elemento encontrado en la posicion: " + indice;
      } else {
        resultado.textContent = "Elemento no encontrado en el arreglo.";
      }
    }

    btn5.addEventListener("click", buscarElemento);
</script>
</body>
</html>
