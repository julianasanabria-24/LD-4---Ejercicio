<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Collar con dije de zapatilla de cristal sobre terciopelo azul">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="45%" r="75%">
      <stop offset="0" stop-color="#34397e"/>
      <stop offset="1" stop-color="#131538"/>
    </radialGradient>
    <linearGradient id="cristal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffffff" stop-opacity=".95"/>
      <stop offset=".5" stop-color="#9ccaf3" stop-opacity=".8"/>
      <stop offset="1" stop-color="#e0f0ff" stop-opacity=".95"/>
    </linearGradient>
    <path id="destello" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>
  </defs>

  <rect width="600" height="600" fill="url(#fondo)"/>
  <!-- Pliegues del terciopelo -->
  <path d="M0 470C150 430 450 520 600 460" fill="none" stroke="#4a51a6" stroke-width="40" opacity=".35"/>

  <!-- Cadena dorada -->
  <path d="M120 60C150 250 230 330 300 340C370 330 450 250 480 60" fill="none" stroke="#e8c37a" stroke-width="7" stroke-dasharray="1 11" stroke-linecap="round"/>
  <!-- Argolla -->
  <circle cx="300" cy="352" r="12" fill="none" stroke="#e8c37a" stroke-width="5"/>

  <!-- Dije: zapatilla de cristal -->
  <g transform="translate(300 420) scale(.62) translate(-290 -380)">
    <path d="M398 404L406 446H420L426 396" fill="url(#cristal)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M150 392C158 360 220 350 282 360C326 366 356 340 380 306C396 284 430 288 432 318L430 392C430 404 420 412 404 412H172C152 412 144 404 150 392Z" fill="url(#cristal)" stroke="#fff" stroke-width="6" stroke-linejoin="round"/>
    <path d="M188 378C230 366 280 372 316 378" fill="none" stroke="#fff" stroke-width="8" stroke-linecap="round"/>
  </g>

  <!-- Destellos -->
  <use href="#destello" fill="#fff" transform="translate(380 380) scale(20)"/>
  <use href="#destello" fill="#e8c37a" transform="translate(110 400) scale(12)"/>
  <use href="#destello" fill="#fff" transform="translate(500 470) scale(10)"/>
  <use href="#destello" fill="#9ccaf3" transform="translate(300 150) scale(14)"/>
  <use href="#destello" fill="#e8c37a" transform="translate(520 140) scale(9)"/>
</svg>
