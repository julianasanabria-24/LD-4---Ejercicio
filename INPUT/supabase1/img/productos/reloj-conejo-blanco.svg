<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Reloj de bolsillo dorado con cadena, rodeado de símbolos de naipes">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="42%" r="78%">
      <stop offset="0" stop-color="#f3edff"/>
      <stop offset="1" stop-color="#c3b1ee"/>
    </radialGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc9c"/>
      <stop offset=".5" stop-color="#d9a84a"/>
      <stop offset="1" stop-color="#a87726"/>
    </linearGradient>
    <path id="destello" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>
  </defs>

  <rect width="600" height="600" fill="url(#fondo)"/>

  <!-- Símbolos de naipes alrededor -->
  <g font-family="Georgia, serif" font-size="54" text-anchor="middle">
    <text x="100" y="140" fill="#d93b55">♥</text>
    <text x="510" y="150" fill="#2d2a55">♠</text>
    <text x="90" y="500" fill="#2d2a55">♣</text>
    <text x="520" y="520" fill="#d93b55">♦</text>
  </g>

  <!-- Cadena -->
  <path d="M300 128C250 70 170 60 130 90C100 112 110 160 160 170" fill="none" stroke="#a87726" stroke-width="7" stroke-dasharray="2 12" stroke-linecap="round"/>

  <!-- Reloj -->
  <rect x="284" y="112" width="32" height="26" rx="6" fill="url(#oro)"/>
  <circle cx="300" cy="110" r="14" fill="none" stroke="url(#oro)" stroke-width="8"/>
  <circle cx="300" cy="300" r="160" fill="url(#oro)"/>
  <circle cx="300" cy="300" r="138" fill="#fffaf0"/>
  <circle cx="300" cy="300" r="122" fill="none" stroke="#e8dcc0" stroke-width="3"/>
  <!-- 12 marcas: una línea girada de a 30° -->
  <g stroke="#6c5a8e" stroke-width="6" stroke-linecap="round">
    <path d="M300 178v16"/><path d="M300 178v16" transform="rotate(30 300 300)"/>
    <path d="M300 178v16" transform="rotate(60 300 300)"/><path d="M300 178v16" transform="rotate(90 300 300)"/>
    <path d="M300 178v16" transform="rotate(120 300 300)"/><path d="M300 178v16" transform="rotate(150 300 300)"/>
    <path d="M300 178v16" transform="rotate(180 300 300)"/><path d="M300 178v16" transform="rotate(210 300 300)"/>
    <path d="M300 178v16" transform="rotate(240 300 300)"/><path d="M300 178v16" transform="rotate(270 300 300)"/>
    <path d="M300 178v16" transform="rotate(300 300 300)"/><path d="M300 178v16" transform="rotate(330 300 300)"/>
  </g>
  <!-- "¡Llego tarde!": las agujas casi en las doce -->
  <path d="M300 300V206" stroke="#2d2a55" stroke-width="7" stroke-linecap="round"/>
  <path d="M300 300L284 236" stroke="#2d2a55" stroke-width="10" stroke-linecap="round"/>
  <circle cx="300" cy="300" r="11" fill="#a87726"/>

  <!-- Destellos -->
  <use href="#destello" fill="#fff" transform="translate(420 200) scale(18)"/>
  <use href="#destello" fill="#a87726" transform="translate(470 420) scale(12)"/>
  <use href="#destello" fill="#fff" transform="translate(140 330) scale(10)"/>
</svg>
