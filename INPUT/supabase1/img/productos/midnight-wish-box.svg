<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Midnight Wish Box: caja azul medianoche con estrellas doradas y luna creciente">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="40%" r="80%">
      <stop offset="0" stop-color="#2d2468"/>
      <stop offset="1" stop-color="#0b0822"/>
    </radialGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#28216a"/>
      <stop offset="1" stop-color="#15103f"/>
    </linearGradient>
    <linearGradient id="oro" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f6dc9c"/>
      <stop offset="1" stop-color="#c3913a"/>
    </linearGradient>
    <pattern id="estrellas" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M15 8l2 6h6l-5 4 2 6-5-4-5 4 2-6-5-4h6z" fill="#e8c37a" opacity=".85"/>
      <circle cx="45" cy="42" r="2.5" fill="#e8c37a" opacity=".7"/>
    </pattern>
    <path id="destello" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>
  </defs>

  <rect width="600" height="600" fill="url(#fondo)"/>
  <!-- Estrellas del cielo -->
  <g fill="#fff" opacity=".8">
    <circle cx="80" cy="260" r="2"/><circle cx="520" cy="300" r="2.5"/><circle cx="450" cy="70" r="2"/>
    <circle cx="250" cy="60" r="1.5"/><circle cx="560" cy="200" r="1.5"/><circle cx="40" cy="420" r="2"/>
  </g>

  <!-- Luna creciente -->
  <path d="M150 70A86 86 0 1 0 236 186A68 68 0 1 1 150 70Z" fill="url(#oro)"/>

  <!-- Caja -->
  <ellipse cx="300" cy="512" rx="200" ry="22" fill="#000" opacity=".35"/>
  <rect x="140" y="300" width="320" height="205" rx="14" fill="url(#caja)"/>
  <rect x="140" y="300" width="320" height="205" rx="14" fill="url(#estrellas)"/>
  <rect x="282" y="300" width="36" height="205" fill="url(#oro)"/>
  <rect x="122" y="262" width="356" height="58" rx="12" fill="url(#caja)" stroke="#3b3290" stroke-width="2"/>
  <rect x="122" y="262" width="356" height="58" rx="12" fill="url(#estrellas)"/>
  <rect x="282" y="262" width="36" height="58" fill="url(#oro)"/>
  <!-- Lazo dorado -->
  <path d="M300 264C252 202 188 214 204 252C214 278 266 274 300 264Z" fill="url(#oro)"/>
  <path d="M300 264C348 202 412 214 396 252C386 278 334 274 300 264Z" fill="url(#oro)"/>
  <circle cx="300" cy="264" r="17" fill="#c3913a"/>
  <!-- Sello "edición limitada" -->
  <circle cx="420" cy="440" r="38" fill="none" stroke="#e8c37a" stroke-width="3" stroke-dasharray="4 5"/>
  <use href="#destello" fill="#e8c37a" transform="translate(420 440) scale(18)"/>

  <!-- Destellos -->
  <use href="#destello" fill="#fff" transform="translate(470 190) scale(20)"/>
  <use href="#destello" fill="#e8c37a" transform="translate(90 340) scale(12)"/>
  <use href="#destello" fill="#fff" transform="translate(360 130) scale(9)"/>
</svg>
