<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 600" role="img" aria-label="Mickey Magic Box: caja de regalo roja de lunares con diadema de orejitas">
  <defs>
    <radialGradient id="fondo" cx="50%" cy="38%" r="75%">
      <stop offset="0" stop-color="#fff6ea"/>
      <stop offset="1" stop-color="#f4c6b4"/>
    </radialGradient>
    <linearGradient id="caja" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e3363f"/>
      <stop offset="1" stop-color="#ac1f2b"/>
    </linearGradient>
    <linearGradient id="tapa" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f24a52"/>
      <stop offset="1" stop-color="#c62834"/>
    </linearGradient>
    <pattern id="lunares" width="46" height="46" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="6.5" fill="#fff"/>
      <circle cx="35" cy="35" r="6.5" fill="#fff"/>
    </pattern>
    <path id="destello" d="M0-1C.12-.12.12-.12 1 0C.12.12.12.12 0 1C-.12.12-.12.12-1 0C-.12-.12-.12-.12 0-1Z"/>
  </defs>

  <rect width="600" height="600" fill="url(#fondo)"/>
  <ellipse cx="300" cy="512" rx="200" ry="24" fill="#8a2b2b" opacity=".16"/>

  <!-- Caja con lunares y cinta dorada -->
  <rect x="140" y="300" width="320" height="205" rx="14" fill="url(#caja)"/>
  <rect x="140" y="300" width="320" height="205" rx="14" fill="url(#lunares)" opacity=".85"/>
  <rect x="282" y="300" width="36" height="205" fill="#ffd24a"/>
  <rect x="122" y="262" width="356" height="58" rx="12" fill="url(#tapa)"/>
  <rect x="122" y="262" width="356" height="58" rx="12" fill="url(#lunares)" opacity=".7"/>
  <rect x="282" y="262" width="36" height="58" fill="#ffd24a"/>

  <!-- Lazo -->
  <path d="M300 264C252 202 188 214 204 252C214 278 266 274 300 264Z" fill="#ffd24a"/>
  <path d="M300 264C348 202 412 214 396 252C386 278 334 274 300 264Z" fill="#ffd24a"/>
  <path d="M300 264C262 226 222 230 226 250" fill="none" stroke="#e7ad1f" stroke-width="4"/>
  <path d="M300 264C338 226 378 230 374 250" fill="none" stroke="#e7ad1f" stroke-width="4"/>
  <circle cx="300" cy="264" r="17" fill="#f0b821"/>

  <!-- Diadema de orejitas flotando sobre la caja -->
  <g transform="translate(0 -6)">
    <path d="M188 178Q300 96 412 178" fill="none" stroke="#211b33" stroke-width="15" stroke-linecap="round"/>
    <circle cx="204" cy="132" r="47" fill="#211b33"/>
    <circle cx="396" cy="132" r="47" fill="#211b33"/>
    <circle cx="190" cy="118" r="12" fill="#fff" opacity=".12"/>
    <circle cx="382" cy="118" r="12" fill="#fff" opacity=".12"/>
    <path d="M300 128l-36-21v42z" fill="#e3363f"/>
    <path d="M300 128l36-21v42z" fill="#e3363f"/>
    <circle cx="279" cy="122" r="4.5" fill="#fff"/>
    <circle cx="321" cy="135" r="4.5" fill="#fff"/>
    <circle cx="300" cy="128" r="10" fill="#b82330"/>
  </g>

  <!-- Destellos -->
  <use href="#destello" fill="#f0b821" transform="translate(96 96) scale(20)"/>
  <use href="#destello" fill="#f0b821" transform="translate(508 230) scale(16)"/>
  <use href="#destello" fill="#e3363f" transform="translate(500 92) scale(11)"/>
  <use href="#destello" fill="#fff" transform="translate(92 300) scale(12)"/>
  <use href="#destello" fill="#f0b821" transform="translate(520 470) scale(10)"/>
</svg>
