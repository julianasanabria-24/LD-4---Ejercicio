<!DOCTYPE html>
<html>
<head>
  <!-- CDN: trae la librería de Supabase ANTES que nuestros propios
       scripts — sin esta línea, "supabase.createClient" no existiría
       todavía cuando supabaseClient.js intente usarlo -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

  <style>
    body {
      font-family: "Montserrat", Arial, sans-serif;
      padding: 20px;
      background: #f4f7fb;
      color: #1f3a5f;
    }

    /* Galería: tantas columnas de ~240px como quepan en la pantalla */
    .galeria {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 20px;
      margin-top: 20px;
    }

    .tarjeta {
      background: #fff;
      border-radius: 12px;
      overflow: hidden;              /* recorta la foto con las esquinas */
      box-shadow: 0 2px 8px rgba(31, 58, 95, 0.12);
      display: flex;
      flex-direction: column;
    }

    /* Foto cuadrada; object-fit: cover la recorta sin deformarla */
    .tarjeta-foto {
      position: relative;
      aspect-ratio: 1 / 1;
      background: #eee;
    }
    .tarjeta-foto img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .etiqueta-descuento,
    .etiqueta-agotado {
      position: absolute;
      top: 10px;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: bold;
      color: #fff;
    }
    .etiqueta-descuento { left: 10px;  background: #d6336c; }
    .etiqueta-agotado   { right: 10px; background: #555; }

    .tarjeta-info {
      padding: 14px 16px 16px;
      display: flex;
      flex-direction: column;
      gap: 6px;
      flex: 1;
    }
    .tarjeta-info h3 { margin: 0; font-size: 16px; }
    .tarjeta-info p  { margin: 0; }

    .categorias  { font-size: 11px; text-transform: uppercase; color: #7fa9d6; }
    .descripcion { font-size: 13px; color: #555; }
    .stock       { font-size: 12px; color: #777; }

    .precio      { font-size: 20px; font-weight: bold; }
    .precio s    { font-size: 13px; font-weight: normal; color: #999; margin-left: 6px; }

    .tarjeta button {
      margin-top: auto;              /* empuja el botón al fondo de la tarjeta */
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #1f3a5f;
      color: #fff;
      cursor: pointer;
    }
    .tarjeta button:disabled { background: #ccc; cursor: not-allowed; }

    /* Producto agotado: foto en gris */
    .tarjeta.agotado img { filter: grayscale(1); opacity: 0.6; }
  </style>
</head>
<body>

  <button id="btn-traer">Traer productos</button>
  <div id="resultado"></div>

  <!-- supabaseClient.js crea "db" (sección 4.3): el cliente ya
       conectado a tu proyecto de Supabase. Lo vamos a usar en
       prueba.js, por eso tiene que cargarse ANTES que ese archivo -->
  <script src="js/supabaseClient.js"></script>
  <!-- prueba.js: aquí escribes el código de los Pasos 2, 3 y 4 -->
  <script src="js/prueba.js"></script>
</body>
</html>
