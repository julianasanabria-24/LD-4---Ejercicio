<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Estado 2 — Grid Básico (para completar en clase)</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
body.dark-mode {
  background-color: #333;
  color:#f3f2f2;
}
    /* ==========================================
       ESTADO 2 — Grid Básico (SIN RESOLVER a propósito)
       Este es el punto de partida para escribirlo en vivo en clase.
       Sigue los TODO en orden — cada uno agrega UNA propiedad de la
       tabla "Propiedades del contenedor" del recurso de Grid/Flexbox
       (semana_03_recurso_css_grid_flexbox_tailwind.md).
    ========================================== */
    .grid-container {
      /* TODO 1: activa Grid en este contenedor.
         Propiedad: display
         Valor: grid
      */
      
      display: grid ;
      
      /* TODO 2: define 3 columnas de 200px cada una.
         Propiedad: grid-template-columns
         Pista: puedes escribir "200px 200px 200px" a mano,
         o usar el atajo repeat(3, 200px) — ambos hacen lo mismo.
      */
      grid-template-columns: 100px 2fr 1fr;
      
      /* TODO 3: agrega espacio entre las celdas, sin usar márgenes.
         Propiedad: gap
         Valor sugerido: 15px
      */
      
       gap:10px;
      
      @media (min-width: 500px) {
      .grid-item {
        background-color: black; 
        }
       }
      
       @media (min-width: 700px) {
      .grid-item {
        border-radius: 50px;
        background-color: rgb(255, 146, 240); 
        }
       }
     
      background-color: #e2e2e2;
      padding: 15px;
      border-radius: 8px;
    }

    .grid-item {
      background-color: #aa4bc2;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    @media (min-width: 600px){
.grid-item-2 {
    display:none;
}

    }
    .grid-item-2{
      background-color: #8724a0;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    .grid-item-3{
      background-color: #71098b;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    /* TODO 4 (opcional, para quien termine antes): alinea el
       contenido de cada celda al centro verticalmente.
       Propiedad: align-items (va en .grid-container, no en .grid-item)
       Valor: center
    */
  </style>
</head>
<body>
  <h1>Mi Primer Grid</h1>
  <p style="margin: 20px 0;">Grid con 3 columnas de 200px cada una — completa los TODO del CSS.</p>

  <div class="grid-container">
    <div class="grid-item">1</div>
    <div class="grid-item">2</div>
    <div class="grid-item">3</div>
    <div class="grid-item">4</div>
    <div class="grid-item">5</div>
    <div class="grid-item">6</div>
    <div class="grid-item">7</div>
    <div id="item8" class="grid-item">8</div>
    <div id="demo" class="grid-item">9</div>
  </div>

 

  <button id="boton">Botón</button>
  <button id="boton2">Modo Oscuro</button>

   <div id="caja2" class="grid-container">
    <div class="grid-item-2">A</div>
    <div class="grid-item-2">B</div>
    <div class="grid-item-2">C</div>
  </div>

  <div id="caja3" class="grid-container">
    <div class="grid-item-3">D</div>
    <div class="grid-item-3">E</div>
    <div class="grid-item-3">F</div>
  </div>

  <script>

let demoDiv = document.getElementById("demo");
let btnMsg = document.getElementById("boton");
btnMsg.addEventListener("click", function () {
  demoDiv.textContent = "holis";
});

let btnMsgg = document.getElementById("boton2");
btnMsgg.addEventListener("click", function () {
  document.body.classList.toggle("dark-mode");
  if (document.body.classList.contains("dark-mode")) {
    btnMsgg.textContent = "Modo Claro";
  } else {
    btnMsgg.textContent = "Modo Oscuro";
  }


});

// Guardamos todos los elementos .grid-item-3 en una lista (NodeList)
let gridItems3 = document.querySelectorAll(".grid-item-3");

// matchMedia crea un objeto que "escucha" una condición de ancho de pantalla,
// igual que un @media de CSS pero consultable desde JS.
// .matches será true si la ventana mide 600px o más en este momento.
let mediaQuery600 = window.matchMedia("(min-width: 600px)");

// Esta función decide si los items se ocultan o se muestran.
// Recibe "event", que es el objeto mediaQuery600 (o el evento "change").
function toggleGridItems3(event) {
  gridItems3.forEach(function (item) {
    // Si event.matches es true (pantalla ancha) -> display:none (se ocultan)
    // Si es false (pantalla angosta) -> display:"" (vuelve al valor del CSS)
    item.style.display = event.matches ? "none" : "";
  });
}

// La ejecutamos una vez al cargar la página, para que arranque en el estado correcto
toggleGridItems3(mediaQuery600);

// Y quedamos escuchando el evento "change": se dispara cada vez que la ventana
// cruza el umbral de 600px (al agrandar o achicar), no en cada pixel de resize
mediaQuery600.addEventListener("change", toggleGridItems3);

  </script>
</body>
</html>
