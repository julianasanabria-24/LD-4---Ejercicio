<!DOCTYPE html>
<html lang="es">
<head>

  <title>Estado 2 — Grid Básico (para completar en clase)</title>
  <style>
    body {

      font-family: Arial, sans-serif;
      padding: 20px;
    }
body.dark-mode {
  background-color: #333;
  color:#f3f2f2;
}
    .grid-container {
      
      display: grid ;
      grid-template-columns: 100px 2fr 1fr;
       gap:10px;
      
      @media (min-width: 500px) {
      .grid-item {
        background-color: black; 
        }
       }
      
       @media (min-width: 700px) {
      .grid-item {
        border-radius: 50px;
        background-color: rgb(255, 146, 240); 
        }
       }
     
      background-color: #e2e2e2;
      padding: 15px;
      border-radius: 8px;
    }

    .grid-item {
      background-color: #aa4bc2;
      color: white;
      padding: 30px;
      text-align: center;
      font-size: 1.5rem;
      border-radius: 6px;
    }

    @media (min-width: 600px){
.grid-item-2 {
    display:none;
}

  </style>
</head>
